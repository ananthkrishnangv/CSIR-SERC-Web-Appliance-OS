# OWASP ModSecurity Core Rule Set (CRS) v4 Setup Configuration
# Baseline Profile: Hardened Institutional Web Services

# Paranoia Level (Default: 1, Hardened: 2)
SecAction \
 "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=1,\
  setvar:tx.executing_paranoia_level=1"

# Anomaly Scoring Inbound & Outbound Limits
SecAction \
 "id:900110,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.inbound_anomaly_score_threshold=5,\
  setvar:tx.outbound_anomaly_score_threshold=4"

# Allowed HTTP Methods
SecAction \
 "id:900200,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT DELETE'"
