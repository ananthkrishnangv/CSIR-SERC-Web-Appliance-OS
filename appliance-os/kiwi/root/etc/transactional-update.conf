# /etc/transactional-update.conf
# CSIR-SWA OS Transactional Update Policy Configuration

# Method of rebooting after update
# options: auto, notify, rebootmgr
REBOOT_METHOD="rebootmgr"

# Run health checks after applying snapshot before setting it default
HEALTH_CHECK="/usr/lib/csir-swa/bin/csir-health-gate.sh"

# Snapshot drop policy: do not drop old snapshots before verifying new boot
KEEP_MAX_SNAPSHOTS=10

# Staging reboot window (24h format, default 02:00 to 04:00)
MAINTENANCE_WINDOW="02:00-04:00"

# Notification endpoint on failure
FAILURE_HOOK="/usr/lib/csir-swa/bin/csir-on-update-failure.sh"
