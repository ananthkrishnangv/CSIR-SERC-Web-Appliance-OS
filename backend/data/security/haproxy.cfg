# CSIR-SWA OS Reverse Proxy Configuration
global
    log /dev/log local0 info
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend csir_https_in
    bind 0.0.0.0:443 ssl crt /etc/csir-swa/certs/default.pem alpn h2,http/1.1
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Appliance-ID CSIR-SWA-01

    # WAF SPOE Hook for Coraza Engine
    filter spoe engine coraza-waf config /etc/coraza/coraza-spoe.conf
    event on-frontend-http-request

    acl is_app_res-portal hdr(host) -i research.csir.res.in
    use_backend bk_res-portal if is_app_res-portal
    acl is_app_recruitment hdr(host) -i recruit.csir.res.in
    use_backend bk_recruitment if is_app_recruitment
    acl is_app_lab-api hdr(host) -i api.serc.res.in
    use_backend bk_lab-api if is_app_lab-api
    acl is_app_app-8c05e6f8 hdr(host) -i sensor-a9eb30.serc.res.in
    use_backend bk_app-8c05e6f8 if is_app_app-8c05e6f8
    acl is_app_app-9a3f3a98 hdr(host) -i sensor-9467e0.serc.res.in
    use_backend bk_app-9a3f3a98 if is_app_app-9a3f3a98
    acl is_app_app-b9f95fc5 hdr(host) -i sensor-c5ff32.serc.res.in
    use_backend bk_app-b9f95fc5 if is_app_app-b9f95fc5
    acl is_app_app-1457dfb5 hdr(host) -i sensor-389234.serc.res.in
    use_backend bk_app-1457dfb5 if is_app_app-1457dfb5
    acl is_app_app-dfa40e34 hdr(host) -i sensor-297d0a.serc.res.in
    use_backend bk_app-dfa40e34 if is_app_app-dfa40e34

# Application Upstream Backends
backend bk_res-portal
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8080 check inter 5s rise 2 fall 3
backend bk_recruitment
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8081 check inter 5s rise 2 fall 3
backend bk_lab-api
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8082 check inter 5s rise 2 fall 3
backend bk_app-8c05e6f8
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8089 check inter 5s rise 2 fall 3
backend bk_app-9a3f3a98
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8089 check inter 5s rise 2 fall 3
backend bk_app-b9f95fc5
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8089 check inter 5s rise 2 fall 3
backend bk_app-1457dfb5
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8089 check inter 5s rise 2 fall 3
backend bk_app-dfa40e34
    mode http
    balance roundrobin
    option httpchk GET /health
    server app1 127.0.0.1:8089 check inter 5s rise 2 fall 3
