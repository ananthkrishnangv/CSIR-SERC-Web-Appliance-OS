name: CSIR-SERC Web Appliance OS - Continuous Integration

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend API & Security Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            pip install fastapi uvicorn pydantic sqlalchemy python-jose cryptography pytest psutil jinja2 pyyaml httpx
          fi

      - name: Run Pytest Test Suites
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          python -m pytest backend/tests -v --durations=10

  shell-syntax-check:
    name: Shell Script Syntax & Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: |
          echo "=== Validating Shell Scripts Syntax with bash -n ==="
          FAILED=0
          find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.git/*" | while read -r script; do
            echo -n "Checking $script ... "
            if bash -n "$script"; then
              echo "OK"
            else
              echo "FAILED"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Shell script syntax validation failed!"
            exit 1
          fi

  package-installer:
    name: Build & Package Universal Installer
    runs-on: ubuntu-latest
    needs: [backend-tests, shell-syntax-check]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Installer Package
        run: |
          python3 installer/package-appliance.py

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: csir-appliance-installer
          path: |
            installer/dist/csir-appliance-installer-v*.tar.gz
            installer/dist/csir-appliance-installer-v*.tar.gz.sha256
          retention-days: 14
