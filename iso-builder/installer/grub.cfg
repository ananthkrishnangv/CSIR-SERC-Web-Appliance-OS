# GRUB2 Configuration for CSIR Secure Web Appliance OS Installation ISO
set default=0
set timeout=10

# Graphical visual styling
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "Install CSIR Secure Web Appliance OS (Automated Feature Installation)" --class opensuse --class gnu-linux --class os {
    echo "Loading CSIR-SWA OS Installer Kernel and Feature Ingestion Subsystem..."
    linux /boot/x86_64/vmlinuz combustion=script autoyast=file:///autoyast/autoinst.xml security=apparmor mitigations=auto console=tty0 console=ttyS0,115200 quiet splash
    initrd /boot/x86_64/initrd
}

menuentry "Install CSIR-SWA OS (Hardened Strategic Air-Gapped Mode)" --class opensuse --class gnu-linux --class os {
    echo "Loading CSIR-SWA OS Air-Gapped Isolated Profile..."
    linux /boot/x86_64/vmlinuz combustion=script autoyast=file:///autoyast/autoinst.xml csir.profile=airgap security=apparmor mitigations=auto console=tty0 quiet
    initrd /boot/x86_64/initrd
}

menuentry "CSIR Hardware Diagnostics & Rescue Environment" --class tool {
    echo "Loading CSIR Diagnostics & Pre-installation Hardware Validation..."
    linux /boot/x86_64/vmlinuz rescue=1 console=tty0
    initrd /boot/x86_64/initrd
}
