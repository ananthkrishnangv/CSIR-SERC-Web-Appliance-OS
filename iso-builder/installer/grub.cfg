# GRUB2 Configuration for CSIR Secure Web Appliance OS Installation ISO
set default=0
set timeout=15

# Graphical visual styling
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "Install CSIR-SWA OS (Full-Stack Sovereign Web & Virtualization Appliance)" --class opensuse --class gnu-linux --class os {
    echo "Loading CSIR-SWA OS Full-Stack Appliance Profile (KVM + VHosts + Quadlets + WAF)..."
    linux /boot/x86_64/vmlinuz combustion=script autoyast=file:///autoyast/autoinst.xml csir_profile=full security=apparmor mitigations=auto console=tty0 console=ttyS0,115200 quiet splash
    initrd /boot/x86_64/initrd
}

menuentry "Install CSIR-SWA OS (High-Density Web Hosting Gateway - VHosts, PHP/Node/Python, SSL)" --class opensuse --class gnu-linux --class os {
    echo "Loading CSIR-SWA OS Web Hosting Gateway Profile..."
    linux /boot/x86_64/vmlinuz combustion=script autoyast=file:///autoyast/autoinst.xml csir_profile=webhosting security=apparmor mitigations=auto console=tty0 quiet splash
    initrd /boot/x86_64/initrd
}

menuentry "Install CSIR-SWA OS (Micro-Virtualization & Container Node - KVM Hypervisor + Quadlets)" --class opensuse --class gnu-linux --class os {
    echo "Loading CSIR-SWA OS KVM Virtualization & Micro-Container Profile..."
    linux /boot/x86_64/vmlinuz combustion=script autoyast=file:///autoyast/autoinst.xml csir_profile=virtualization security=apparmor mitigations=auto console=tty0 quiet splash
    initrd /boot/x86_64/initrd
}

menuentry "Install CSIR-SWA OS (Edge Reverse Proxy & Coraza WAF Security Gateway)" --class opensuse --class gnu-linux --class os {
    echo "Loading CSIR-SWA OS Edge Coraza WAF Security Profile..."
    linux /boot/x86_64/vmlinuz combustion=script autoyast=file:///autoyast/autoinst.xml csir_profile=edge-waf security=apparmor mitigations=auto console=tty0 quiet splash
    initrd /boot/x86_64/initrd
}

menuentry "Install CSIR-SWA OS (Hardened Air-Gapped Laboratory & Archive Node)" --class opensuse --class gnu-linux --class os {
    echo "Loading CSIR-SWA OS Strategic Air-Gapped Laboratory Profile..."
    linux /boot/x86_64/vmlinuz combustion=script autoyast=file:///autoyast/autoinst.xml csir_profile=airgap security=apparmor mitigations=auto console=tty0 quiet
    initrd /boot/x86_64/initrd
}

menuentry "CSIR Hardware Diagnostics & Rescue Environment" --class tool {
    echo "Loading CSIR Diagnostics & Pre-installation Hardware Validation..."
    linux /boot/x86_64/vmlinuz rescue=1 console=tty0
    initrd /boot/x86_64/initrd
}
